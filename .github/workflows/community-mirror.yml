# Copies main (and version tags) to the community's read-only mirror, ai-coding-lab-crew/focus, so members can clone it
# and pull updates without seeing this repo's issues, pull requests or work-in-progress branches. A version tag (v0.2,
# v1.0.0) also becomes a release on the mirror, with notes generated from the commits since the last one.
#
# Needs the COMMUNITY_MIRROR_TOKEN secret: a fine-grained personal access token whose resource owner is
# ai-coding-lab-crew, scoped to the focus repository only, with "Contents: read and write" and
# "Workflows: read and write" (main carries this file, and GitHub only lets a token with Workflows push it).
name: Community mirror

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: community-mirror
  cancel-in-progress: false

env:
  MIRROR: ai-coding-lab-crew/focus

jobs:
  mirror:
    # the mirror carries this file too: it only runs here
    if: github.repository == 'jonhilt/focus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # the checkout's own credentials would be sent to the mirror too, and they can't write there
          persist-credentials: false

      - name: Push main and version tags to the mirror
        env:
          TOKEN: ${{ secrets.COMMUNITY_MIRROR_TOKEN }}
        run: |
          remote="https://x-access-token:${TOKEN}@github.com/${MIRROR}.git"
          git push --force "$remote" HEAD:refs/heads/main
          # a pattern that matches no tags fails the push
          if git tag -l 'v*' | grep -q .; then git push "$remote" 'refs/tags/v*:refs/tags/v*'; fi

      - name: Publish a release for a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.COMMUNITY_MIRROR_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$MIRROR" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$MIRROR" --verify-tag --generate-notes --title "Focus $GITHUB_REF_NAME"
