# Focus's architecture model, for the cartography plugin (plugins/cartography/README.md). Each part owns the code under
# its paths (a folder ends in /; the longest path wins, so a part can claim a file out of another's folder). The office
# works out the connections between parts from the imports, so only the parts (and what each does) and views are
# written here.

parts:
  # the browser
  ship:
    label: The ship in 3D
    does: "Draws the ship, rooms and crew in Three.js"
    layer: Client
    kind: ui
    paths: [client/src/world/]
  station-screens:
    label: Team station screens
    does: "Draws a goal's screens: its sign, board and the lead's work"
    layer: Client
    kind: ui
    paths: [client/src/world/goalScreens.ts, client/src/world/screenPanes.ts, client/src/world/goalRoom.ts]
  panels:
    label: Panels and HUD
    does: "The 2D panels and HUD over the ship"
    layer: Client
    kind: ui
    paths: [client/src/ui/]
  client-net:
    label: Mirror of the office
    does: "Keeps the browser's copy of the office's state, over /ws"
    layer: Client
    kind: store
    paths: [client/src/net/]
  client-app:
    label: Browser app and plugins
    does: "Starts the browser: the player, sound, plugins"
    layer: Client
    kind: ui
    paths: [client/src/]
  tricorder:
    label: Tricorder phone view
    does: "The phone view at /tricorder"
    layer: Client
    kind: ui
    paths: [client/src/tricorder/]

  # both sides
  types:
    label: Shared types
    does: "Types the server and browser share"
    layer: Shared
    kind: type
    paths: [shared/types/]
  artifacts:
    label: Lead artifacts
    does: "Where a lead's shown pages are served from"
    layer: Shared
    kind: type
    paths: [shared/artifacts.ts]
  shared:
    label: Shared rules
    does: "Rules the server and browser both run"
    layer: Shared
    kind: service
    paths: [shared/]

  # the office
  http:
    label: Office, routes and hub
    does: "Starts the office: REST routes and the /ws hub"
    layer: Server
    kind: route
    paths: [server/index.ts, server/routes.ts, server/hub.ts, server/office.ts]
  manager:
    label: Agent manager
    does: "Runs every agent: seating, sessions, delivery, QA"
    layer: Server
    kind: service
    paths: [server/agents/manager/, server/agents/manager.ts, server/agents/services.ts]
  office-tools:
    label: Lead's office tools
    does: "The tools a lead calls: note, show, ship…"
    layer: Server
    kind: handler
    paths: [server/agents/officeTool.ts, server/agents/manager/goalTools.ts]
  agents:
    label: Agent sessions
    does: "Claude Code sessions, prompts and their output"
    layer: Server
    kind: service
    paths: [server/agents/]
  github:
    label: GitHub
    does: "Talks to GitHub through gh"
    layer: Server
    kind: external
    paths: [server/github/]
  plugin-host:
    label: Plugin host
    does: "Loads plugins and lends them the office"
    layer: Server
    kind: service
    paths: [server/plugins/]
  voice:
    label: Voice
    does: "Dictation and the crew's spoken voices"
    layer: Server
    kind: service
    paths: [server/voice.ts, server/speech.ts, server/speechWorker.ts]
  server-core:
    label: Store, config, previews
    does: "The saved state, config and PR previews"
    layer: Server
    kind: store
    paths: [server/]

  plugin-api:
    label: Plugin API
    does: "All a plugin may import of the office, and the line its test holds"
    layer: Plugins
    kind: service
    paths: [plugin-api/]
  plugins:
    label: Plugins
    does: "What's beyond the core: scorecard, climber, cartography, flow, retro, Number One"
    layer: Plugins
    kind: service
    paths: [plugins/]

ignore: [scripts/, eslint.config.js, vite.config.ts, vitest.config.ts, vitest.setup.ts]

views:
  show-to-screen:
    question: How does a lead's show reach the station's screen?
    parts: [office-tools, manager, client-net, ship, artifacts, panels]
    answer: "The office tools keep the page on the lead, the manager sends the lead to the browser over /ws, and the station's screen draws its picture."
    steps:
      - { from: office-tools, to: manager, says: "keeps the shown page on the lead", cite: server/agents/manager/goalTools.ts:62 }
      - { from: manager, to: client-net, says: "sends the lead's update over /ws", cite: server/agents/manager/core.ts:169 }
      - { from: client-net, to: ship, says: "hands the station screen the lead's latest page", cite: client/src/world/room.ts:396 }
      - { from: ship, to: artifacts, says: "asks where the page's picture is served", cite: client/src/world/screen.ts:360 }
      - { from: panels, to: artifacts, says: "opens the page up close when you press E", cite: client/src/ui/screenPanel.ts:169 }
  note-to-browser:
    question: How does a lead's note reach the browser?
    parts: [agents, manager, office-tools, client-net]
    answer: "The lead's session calls the note tool, the office tools update the lead, and the manager sends it to the browser over /ws."
    trace: { message: agent, through: office-tools }
  plugins:
    question: How do plugins plug into the office?
    parts: [plugins, plugin-host, manager, http, client-app, panels]
