# USS Focus TV: a goal from start to ship, everything a lead does along the way. `pnpm run studio scenes/full.yaml`
# records it, and the training console on the demo ship's bridge plays it live (docs/studio.md).
title: A goal, start to ship
# the demo's pacing: half the speed of `pnpm run demo`, so there's time to see each part
speed: 0.5
seed: 7
project: Sock Shop
goal: Shoppers can save items for later and find them again on any device
# the lead's whole story: the explainer, helpers, background jobs and workflows (shared/scenarios.ts)
scenario: full
# the captain's moves when the training console plays it live: ] makes the next, [ steps back (shared/trainingSteps.ts)
steps:
  - start-goal
  - answer
  - approve
  - merge

beats:
  - title: Cold open
    shot: bridge
    caption: This is the USS Focus. Every member of its crew is a Claude Code session.
    hold: 6

  - title: A goal
    do: start-goal
    shot: station
    caption: The captain hands a goal to a lead, a long-running Claude Code session at its own team station.
    until: lead-working
    hold: 6

  - title: The lead looks around
    shot: lead
    glide: 3
    caption: The lead reads the repos, puts a plan on screen and asks before it builds anything.
    until: lead-idle
    hold: 4

  - title: Go ahead
    do: answer
    shot: station
    caption: The captain picks an option. The lead explains its plan on screen as it starts.
    until: lead-working
    hold: 6

  - title: Helpers
    shot: helpers
    glide: 3
    caption: It hands each repo to a helper, a subagent with a fresh context of its own, on a smaller, faster model.
    until: helpers-working
    hold: 6

  - title: Report back
    shot: crew
    glide: 4
    caption: Each helper hands back a short summary. The lead builds, with the app running in the background.
    until: helpers-done
    hold: 6

  - title: A workflow
    shot: lead
    glide: 3
    caption: To review the slice, the lead writes a workflow, a script that fans the work out to dozens of agents.
    until: workflows-running
    hold: 4

  - title: The away team
    shot: transporter
    caption: Its agents beam onto the pads of a transporter room, phase by phase, and only their findings come back.
    until: workflows-done
    hold: 6

  - title: Ship it
    shot: station
    caption: With the review in, the lead ships the slice across both repos.
    until: shipped
    hold: 8

  - title: Wrap
    shot: bridge
    caption: "One lead: helpers for the reading, workflows for the wide jobs, and the captain's call at every turn."
    hold: 6
