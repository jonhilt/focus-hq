<!doctype html><html><head><style>
body{margin:0;background:#0b0b18;font-family:Antonio,'Arial Narrow',sans-serif;color:#eee;width:1280px;height:800px;overflow:hidden}
.note{font-size:15px;fill:#ffcc66}
.lbl{font-size:13px;fill:#cfd8ff}
.mono{font-family:'JetBrains Mono',monospace}
</style></head><body>
<svg width="1280" height="800" viewBox="0 0 1280 800">
<defs>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#9f6" stop-opacity="1"/><stop offset="1" stop-color="#9f6" stop-opacity="0"/></radialGradient>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fe3ff" stop-opacity=".55"/><stop offset="1" stop-color="#5fe3ff" stop-opacity=".05"/></linearGradient>
</defs>
<!-- title -->
<text x="40" y="48" font-size="32" fill="#ff9900">THE ROOM, FROM WHERE YOU BEAM IN</text>
<text x="40" y="76" font-size="17" fill="#aaa">The hologram floats in front of the platform, above the console, high enough to read over the agents' heads</text>

<!-- room backdrop -->
<rect x="40" y="96" width="860" height="660" rx="14" fill="#cfcbe0"/>
<rect x="40" y="560" width="860" height="196" fill="#3b3f6b"/>
<!-- light panels -->
<g fill="#e8e6f5"><rect x="250" y="130" width="50" height="300"/><rect x="320" y="130" width="50" height="300"/><rect x="390" y="130" width="50" height="300"/><rect x="460" y="130" width="50" height="300"/><rect x="530" y="130" width="50" height="300"/><rect x="600" y="130" width="50" height="300"/></g>
<!-- platform tiers -->
<rect x="190" y="470" width="520" height="30" fill="#6e6a86"/><rect x="160" y="500" width="580" height="30" fill="#77738f"/><rect x="130" y="530" width="640" height="30" fill="#807c98"/>
<!-- pads with agents -->
<g>
 <ellipse cx="250" cy="545" rx="30" ry="7" fill="#9cf"/><ellipse cx="350" cy="545" rx="30" ry="7" fill="#9cf"/><ellipse cx="450" cy="545" rx="30" ry="7" fill="#f96"/><ellipse cx="550" cy="545" rx="30" ry="7" fill="#f96"/><ellipse cx="650" cy="545" rx="30" ry="7" fill="#9f6"/>
 <g fill="#2a2a3a"><rect x="238" y="490" width="24" height="55" rx="10"/><rect x="338" y="490" width="24" height="55" rx="10"/><rect x="438" y="490" width="24" height="55" rx="10"/><rect x="538" y="490" width="24" height="55" rx="10"/><rect x="638" y="490" width="24" height="55" rx="10"/></g>
 <g fill="#f5c79a"><circle cx="250" cy="480" r="12"/><circle cx="350" cy="480" r="12"/><circle cx="450" cy="480" r="12"/><circle cx="550" cy="480" r="12"/><circle cx="650" cy="480" r="12"/></g>
</g>

<!-- beams from phase nodes down to pads -->
<polygon points="300,330 312,330 256,470 244,470" fill="url(#beam)"/>
<polygon points="300,330 312,330 356,470 344,470" fill="url(#beam)"/>
<polygon points="470,330 482,330 456,470 444,470" fill="url(#beam)" style="filter:hue-rotate(160deg)"/>
<polygon points="470,330 482,330 556,470 544,470" fill="url(#beam)" style="filter:hue-rotate(160deg)"/>

<!-- result packet rising from finished agent -->
<line x1="650" y1="470" x2="645" y2="340" stroke="#9f6" stroke-width="2" stroke-dasharray="4 6" opacity=".7"/>
<circle cx="647" cy="395" r="14" fill="url(#glow)"/><circle cx="647" cy="395" r="5" fill="#dfffd0"/>

<!-- hologram -->
<rect x="190" y="190" width="560" height="150" rx="16" fill="#0a1a3a" fill-opacity=".82" stroke="#5fe3ff" stroke-width="3"/>
<text x="210" y="218" font-size="18" fill="#5fe3ff">REVIEW-SLICE</text><text x="730" y="218" font-size="15" fill="#5fe3ff" text-anchor="end" class="mono">T+ 2:05</text>
<!-- nodes -->
<line x1="306" y1="270" x2="476" y2="270" stroke="#5fe3ff" stroke-width="3"/>
<line x1="476" y1="270" x2="646" y2="270" stroke="#5fe3ff" stroke-width="3" stroke-dasharray="8 6" opacity=".6"/>
<circle cx="306" cy="270" r="24" fill="#9cf"/><text x="306" y="276" text-anchor="middle" font-size="16" fill="#000">4</text>
<circle cx="476" cy="270" r="24" fill="#f96"/><text x="476" y="276" text-anchor="middle" font-size="16" fill="#000">2</text>
<circle cx="646" cy="270" r="24" fill="none" stroke="#fc6" stroke-width="3"/><circle cx="646" cy="270" r="10" fill="#9f6" opacity=".9"/>
<text x="306" y="312" text-anchor="middle" font-size="16" fill="#9cf">SCAN</text><text x="306" y="330" text-anchor="middle" class="lbl">one per area · 3 back</text>
<text x="476" y="312" text-anchor="middle" font-size="16" fill="#f96">CHECK</text><text x="476" y="330" text-anchor="middle" class="lbl">confirm each finding</text>
<text x="646" y="312" text-anchor="middle" font-size="16" fill="#fc6">FAN</text><text x="646" y="330" text-anchor="middle" class="lbl">not yet reached</text>
<!-- tick marks for returned results on Scan -->
<g fill="#9f6"><circle cx="280" cy="240" r="4"/><circle cx="292" cy="236" r="4"/><circle cx="304" cy="234" r="4"/></g>

<!-- console -->
<polygon points="300,640 600,640 640,740 260,740" fill="#111" stroke="#f90" stroke-width="5"/>
<text x="450" y="700" text-anchor="middle" font-size="14" fill="#fc6">CONSOLE · THE SCRIPT (SLICE 1)</text>

<!-- callouts -->
<g class="note">
<line x1="750" y1="230" x2="930" y2="160" stroke="#ffcc66"/><text x="935" y="150">1 · Phases from the script's meta</text>
<text x="935" y="170" font-size="14" fill="#ccc">Nodes in order, coloured as on the tactical display.</text>
<text x="935" y="188" font-size="14" fill="#ccc">Lit and breathing while it has agents at work; the</text>
<text x="935" y="206" font-size="14" fill="#ccc">number is how many. Unreached ones are hollow.</text>

<line x1="490" y1="400" x2="930" y2="290" stroke="#ffcc66"/><text x="935" y="280">2 · Beams to the pads</text>
<text x="935" y="300" font-size="14" fill="#ccc">A faint beam from each active node down to each</text>
<text x="935" y="318" font-size="14" fill="#ccc">agent of its phase on the pads: who is working for</text>
<text x="935" y="336" font-size="14" fill="#ccc">which part of the script.</text>

<line x1="665" y1="395" x2="930" y2="420" stroke="#ffcc66"/><text x="935" y="410">3 · Results flow back</text>
<text x="935" y="430" font-size="14" fill="#ccc">When an agent finishes, a green packet rises from its</text>
<text x="935" y="448" font-size="14" fill="#ccc">pad into its node (red if it failed), and a tick is</text>
<text x="935" y="466" font-size="14" fill="#ccc">added round the node: "3 back". Read live from the</text>
<text x="935" y="484" font-size="14" fill="#ccc">journal Claude Code writes as each agent finishes.</text>

<text x="935" y="540">4 · At the end</text>
<text x="935" y="560" font-size="14" fill="#ccc">A final node, RETURN, lights; a packet beams up out</text>
<text x="935" y="578" font-size="14" fill="#ccc">of the hologram towards the briefing room, and the</text>
<text x="935" y="596" font-size="14" fill="#ccc">hologram fades with the away team.</text>

<text x="935" y="650">Style</text>
<text x="935" y="670" font-size="14" fill="#ccc">Navy glass and glowing outline, like the shell</text>
<text x="935" y="688" font-size="14" fill="#ccc">probes and team screens. Solid while you aim at it;</text>
<text x="935" y="706" font-size="14" fill="#ccc">E on it opens the script panel.</text>
</g>
</svg>
</body></html>
