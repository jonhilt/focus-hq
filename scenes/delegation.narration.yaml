# Episode 1's narration (docs/studio.md): the presenter's takes and the parts of each kept, in order, in seconds of
# their take. `pnpm run studio --narrate delegation` cuts them together (dropping ums and shortening long pauses) into
# studio-out/narration-delegation/: narration.mp4, words.json and beats.json, which the shot plan is timed against.
takes:
  t1: ~/Movies/2026-10-12 13-36-19.mp4   # the whole episode, first go
  t2: ~/Movies/2026-10-12 14-07-53.mp4   # the workflows section again, tightened
keep:
  - { take: t1, from: 0, to: 186.7, why: "solo, subagents and nested, up to 'break the work up even further'" }
  - { take: t2, from: 0, to: 133.95, why: "workflows, up to 'but it's worth a try'" }
  - { take: t2, from: 140.2, to: 204.6, why: "skips the repeated 'worth a try… if it becomes a command'; ends on /deep-research" }
maxPause: 0.6
