      out: { kind: grid-wipe, over: 0.8, title: "5 · /BATCH", resets: [pads, slate, rack] } }
  # Rung 5: /batch, many changes in parallel worktrees, each its own PR
  - { id: s5.1, span: [r5, r5b], idea: "/batch: many changes at once.", look: lead,
      camera: { size: MS, on: { lead: [0.28, 0.60] }, angle: [20, -6], fov: 35, move: { kind: hold } },
      do: [{ at: r5.batch, act: say, who: lead, line: "/batch rename userId → accountId" }],
      out: { kind: cut } }
  - { id: s5.2, span: [r5b, r5b.nobody-0.3], idea: "Each change gets its own agent in its own worktree.", look: lanes,
      camera: { size: FS, on: { lead: [0.25, 0.62] }, angle: [0, -12], fov: 44,
                move: { kind: crane, to: { size: LS, angle: [0, -38], on: { lead: [0.12, 0.55], lanes: [0.60, 0.50] } }, at: r5b, over: 3,
                        ease: inOut, why: "lanes are a layout, best read from above; follows the eight chips out" } },
      do: [{ at: r5b, act: send, from: lead, to: lanes.heads, lane: low, gap: 0.15, text: rename },
           { at: r5b.worktree, act: beam-in, who: lanes.tree, gap: 0.15 },
           { after: 0.6, act: beam-in, who: lanes.console, gap: 0.15 }] }
  - { id: s5.3, span: [r5b.nobody-0.3, r5c], idea: "A separate copy each, so nobody collides.", look: lanes.3,
      camera: { size: MCU, on: { lanes.3.console: [0.40, 0.56], lanes.3.tree: [0.70, 0.44] }, angle: [15, -20], fov: 32, move: { kind: hold } },
      do: [{ at: r5b.nobody, act: glow, what: lanes.3.tree, over: 1 }] }
  - { id: s5.4, span: [r5c, recap], idea: "Side by side, each tests its change and ends in its own PR.", look: lanes.pr,
      camera: { size: LS, on: { lead: [0.12, 0.55], lanes: [0.60, 0.50] }, angle: [0, -38], fov: 44, move: { kind: hold } },
      do: [{ at: r5c.side, act: progress, what: lanes },
           { at: r5d.pull-1.0, act: send, from: lanes.console, to: lanes.pr, lane: low, gap: 0.12, text: git push },
           { at: r5d.pull, act: show, what: lanes.pr, gap: 0.25 },
           { at: r5d.pull+2.0, act: count, what: lanes, text: 8 PULL REQUESTS }],
      out: { kind: grid-wipe, over: 0.8, title: THE LADDER, resets: [lanes] } }
  # Recap: up the ladder, one rung per word
  - { id: s6.1, span: [recap, end], idea: "Five rungs, one after another.", look: ladder,
      camera: { size: MS, on: { lead: [0.25, 0.60] }, angle: [20, -6], fov: 35, move: { kind: hold } },
      do: [{ at: recap, act: show, what: ladder },
           { at: [recap.one, recap.helpers, recap.nested, recap.workflow, recap.batch], act: show, what: [ladder.1, ladder.2, ladder.3, ladder.4, ladder.5] }],
      out: { kind: move, over: 1.5 } }
  - { id: s6.2, span: [end, end.end+2], idea: "Same Claude in every rung; it knows when to hand off.", look: lead,
