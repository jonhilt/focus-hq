      out: { kind: cut } }
  - { id: s4.5, span: [r4c.wave-0.6, r4d.script-0.2], idea: "Wave after wave.", look: pads,
      camera: { size: LS, on: { pads: [0.55, 0.55] }, angle: [0, -30], fov: 24, move: { kind: hold } },
      do: [{ at: r4c.wave-0.6, act: cycle, what: pads, work: [0.8, 1.6], until: 50 },
