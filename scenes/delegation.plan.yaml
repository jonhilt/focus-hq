# Episode 1, "How Claude delegates": the shot plan the holodeck stage plays (docs/studio.md), shot against the presenter's
# real narration (studio-out/narration-delegation: 6:24, words.json and beats.json). The auto-split beats are merged into
# sentences here; every `at` and mark is a word's start in words.json. The presenter sits picture-in-picture in the bottom
# right (about 23% of the width), so no subject goes below y 0.68 right of x 0.72.
#   pnpm run studio --stage delegation
plan: 1
episode: how-claude-delegates
narration: { video: studio-out/narration-delegation/narration.mp4, beats: studio-out/narration-delegation/beats.json }
# the voice is there now: no subtitles (rule 5)
preview: { captions: false }
stage: { set: holodeck, frame: [1920, 1080], fps: 30 }

beats:
  # Intro
  - { id: hook, at: 0.0, text: "There are lots of ways to get work done in Claude Code, and some of them include doing work in parallel.", marks: { work: 2.36, parallel: 6.41 } }
  - { id: subs, at: 6.92, text: "So you might have seen, for example, sub-agents that explore your code base and then feed those results back to the main agent to do work.", marks: { subagents: 9.23, explore: 10.38, results: 13.24 } }
  - { id: new, at: 15.26, text: "Sub-agents have been around a while now, and they've just been joined in the Claude Code harness by something new called dynamic workflows.", marks: { joined: 20.65, called: 23.9, dynamic: 24.35 } }
  - { id: plan, at: 25.18, text: "So in this video, we're going to look at the difference between working in an agent versus working with sub-agents, and how that compares to dynamic workflows.", marks: { difference: 28.04, agent: 29.26, subagents: 30.43, dynamic: 33.67 } }
  - { id: jump, at: 38.16, text: "So let's jump in.", marks: { jump: 38.72 } }
  # 1 · On its own
  - { id: r1, at: 39.64, text: "First of all, the standard way of working with Claude Code is to start a session as an agent, start typing and just go at it that way.", marks: { start: 45.9, typing: 47.97 } }
  - { id: r1b, at: 50.26, text: "You choose the model, you choose the effort, you choose the permissions mode.", marks: { model: 51.01, effort: 51.84, permissions: 52.68 } }
  # 2 · Subagents
  - { id: r2, at: 53.74, text: "But then sometimes Claude will spin up sub-agents, and it will tell you that it's doing that, and you'll also see them running in Claude Code.", marks: { spin: 57.45, tell: 59.16, see: 61.58 } }
  - { id: r2b, at: 62.96, text: "And the sub-agent at that point has its own context window.", marks: { own: 65.07, context: 65.74 } }
  - { id: r2c, at: 66.41, text: "So the main thread, the main session, has its own context window.", marks: { own: 69.26, context: 69.5 } }
  - { id: r2d, at: 71.03, text: "And while this may be beginning to change a little bit, in general your sessions hit a kind of dumb zone.", marks: { sessions: 76.35, dumb: 77.71 } }
  - { id: r2e, at: 78.54, text: "The more that context window fills up, the worse they tend to perform.", marks: { fills: 80.36, worse: 81.62 } }
  - { id: r2f, at: 83.3, text: "And one way to protect that context window and keep it emptier is to use sub-agents.", marks: { protect: 83.97, emptier: 86.73, subagents: 91.11 } }
  - { id: r2g, at: 92.29, text: "So if you say, for example, please, I want to implement this feature. Please look at the existing code to figure out where this feature can fit in.", marks: { implement: 96.46, existing: 99.26 } }
  - { id: r2h, at: 102.14, text: "Use several explore agents on a haiku model, let's say, or a sonnet model.", marks: { explore: 103.8, haiku: 104.94, sonnet: 106.7 } }
  - { id: r2i, at: 107.76, text: "What you'll see is that Claude actually dispatches those agents.", marks: { dispatches: 111.34 } }
  - { id: r2j, at: 112.71, text: "Those agents run off and use whichever model you just said to explore the code and then present their findings back.", marks: { run: 113.45, to: 115.96, explore: 116.06, findings: 117.82 } }
  - { id: r2k, at: 118.58, text: "Now, each of those agents gets its own context window. So what it doesn't do is inherit the entire thread of the main session.", marks: { own: 120.66, inherit: 123.75, entire: 124.68 } }
  - { id: r2l, at: 127.56, text: "Instead, it gets a kind of message from the main session saying, here's your goal or your task. Here's how you should do it. This is what I want you to report back.", marks: { message: 129.51, goal: 131.96, how: 133.84, report: 136.57 } }
  - { id: r2m, at: 137.49, text: "Armed with that, the sub-agent does its work for as long as it needs to exist to do that work.", marks: { work: 139.96, needs: 141.17 } }
  - { id: r2n, at: 142.94, text: "And then it sends details back to the main thread.", marks: { sends: 143.61, thread: 145.32 } }
  - { id: r2o, at: 146.12, text: "Now, the main thread at this point has still got most of its context window available because that work was delegated.", marks: { most: 148.29, available: 149.7, delegated: 152.21 } }
  - { id: r2p, at: 152.99, text: "You can then do that again as many times as you like. And every time, the main agent's context window tends to stay that bit smaller.", marks: { again: 154.2, every: 156.99, context: 159.24, smaller: 161.48 } }
  - { id: r2q, at: 162.21, text: "It might do some thinking about the data it's got back. It might present some information to you. It might ask you a question.", marks: { thinking: 163.18, present: 165.79, ask: 167.43 } }
  - { id: r2r, at: 168.11, text: "Now, sub-agents, just as a quick detail, can also call their own sub-agents. So it's kind of sub-agents all the way down.", marks: { subagents: 168.9, call: 172.55, down: 175.54 } }
  - { id: r2s, at: 176.09, text: "I believe this might be capped at a certain limit, but occasionally an agent might spawn its own sub-agents to break the work up even further.", marks: { limit: 178.7, occasionally: 181.92, spawn: 183.17, further: 185.29 } }
  # 3 · Dynamic workflows
  - { id: r3, at: 185.9, text: "So what about dynamic workflows? Well, these are newer, and the difference comes down to one key thing, which is who holds the plan.", marks: { dynamic: 187.29, difference: 190.53, who: 194.84, plan: 195.83 } }
  - { id: r3b, at: 196.19, text: "So with sub-agents, Claude is the orchestrator: it sends a helper out, reads what comes back, decides what's next, and every answer lands in its context.", marks: { subagents: 196.75, orchestrator: 199.34, sends: 202.52, back: 204.13, decides: 205.79, answer: 207.63, lands: 208.12, context: 208.94 } }
  - { id: r3c, at: 209.5, text: "But with a workflow, Claude writes the plan down as a script instead.", marks: { workflow: 210.15, writes: 211.4, plan: 212.17, script: 213.11 } }
  - { id: r3d, at: 214.26, text: "So you just ask for one, say use workflow, or you can type ultra code and that will trigger it.", marks: { user: 215.66, ultra: 218.64 } }
  - { id: r3e, at: 220.59, text: "And Claude writes a short program: steps, and a loop to loop over every item.", marks: { program: 221.79, steps: 222.35, loop: 223.75, item: 225.31 } }
  - { id: r3f, at: 225.64, text: "So then a runtime runs that script in the background, and your session stays free.", marks: { runtime: 226.21, background: 228.37, free: 230.71 } }
  - { id: r3g, at: 230.95, text: "And slash workflows is a new command you can use: it shows you every phase and every agent as it's going.", marks: { workflows: 231.83, phase: 235.97, agent: 236.88 } }
  - { id: r3h, at: 238.24, text: "And where it kind of shines is, here's an example: I recently moved a whole course out of a CMS into markdown files.", marks: { shines: 239.79, example: 241.61, course: 244.24, markdown: 246.76 } }
  - { id: r3i, at: 248.06, text: "And it was the same job for every lesson, which was to fetch the content, convert it, test it.", marks: { same: 249.16, lesson: 250.66, fetch: 253.18, convert: 254.91, test: 255.75 } }
  - { id: r3j, at: 256.39, text: "And the workflow sent each lesson through those steps, and can run those in parallel.", marks: { sent: 257.89, through: 259.39, steps: 260.68, parallel: 263.01 } }
  - { id: r3k, at: 263.16, text: "So, like, overlapping: while one lesson is converting, the next can be being fetched, and an earlier one's being tested.", marks: { overlapping: 263.87, converting: 265.88, fetched: 268.12, tested: 270.07 } }
  - { id: r3l, at: 270.48, text: "And it can do up to 16 agents at once.", marks: { sixteen: 271.46, once: 272.35 } }
  - { id: r3m, at: 272.74, text: "And because the results go via the script first, not into Claude's context, you essentially get a kind of custom-built harness running all this,", marks: { results: 274.34, script: 276.63, not: 277.56, harness: 282.04 } }
  - { id: r3n, at: 283.35, text: "which means the Claude context doesn't fill up, however many agents are running.", marks: { fill: 285.38, many: 286.3 } }
  - { id: r3o, at: 288.31, text: "And at the end, the orchestrating agent gets one report: this many have been migrated, these three need a look.", marks: { close: 288.76, one: 291.64, report: 291.91, migrated: 295.21, three: 295.62 } }
  - { id: r3p, at: 296.64, text: "And then, yeah, that's kind of it, and for me it converted it really well.", marks: { converted: 299.26 } }
  - { id: r3q, at: 300.31, text: "So I would say a workflow is a good thing to reach for when it's the same step across lots of items: migrations, big refactors, trimming a test suite.", marks: { reach: 302.32, same: 303.22, migrations: 305.92, refactors: 307.21, trimming: 308.36 } }
  - { id: r3r, at: 313.32, text: "I think it probably does cost more tokens, just because you're using lots more agents, but it's worth a try for that kind of work.", marks: { cost: 314.48, lots: 316.75, worth: 318.73 } }
  - { id: r3s, at: 321.15, text: "And of course, if there's something you can extract out of that that's more deterministic, you can always turn it into a command you could just run yourself.", marks: { extract: 324.46, deterministic: 326.35, command: 328.64 } }
  # How you use it
  - { id: r4, at: 330.93, text: "So in terms of how you use it, ultra code will do it by default.", marks: { ultra: 332.87, default: 334.98 } }
  - { id: r4b, at: 335.76, text: "So if you toggle on to ultra code mode, you will get all sorts happening, including dynamic workflows.", marks: { toggle: 336.57, dynamic: 341.29 } }
  - { id: r4c, at: 342.53, text: "You can just use the phrase use workflow.", marks: { user: 344.17 } }
  - { id: r4d, at: 345.33, text: "And you can do forward slash workflows as well, to watch, pause, stop, save.", marks: { workflows: 346.96, watch: 348.28, pause: 348.67, stop: 349.05, save: 349.51 } }
  - { id: r4e, at: 350.2, text: "Up to 16: so you get up to 16 concurrent agents by default, depending on how many CPUs you have available.", marks: { sixteen: 350.93, again: 352.52, concurrent: 353.08, cpus: 357.07 } }
  - { id: r4f, at: 359.1, text: "I think it can do up to a thousand agent runs per kind of workflow run.", marks: { thousand: 361.43, runs: 362.84 } }
  - { id: r4g, at: 365.31, text: "You can have multiple workflows running at the same time, depending on how capable your machine is.", marks: { multiple: 366.33, machine: 370.76 } }
  - { id: r4h, at: 371.37, text: "And the results live in these kind of variables in the script.", marks: { results: 371.77, variables: 373.47, script: 374.43 } }
  - { id: r4i, at: 374.68, end: 384.2, text: "And then the last thing to know is that the deep research command, which you can do forward slash deep research, does this as its default.", marks: { last: 375.76, deep: 377.91, slash: 380.76, default: 383.44 } }

cast:
  lead:       { kind: crew, name: Claude, tag: LEAD · OPUS, accent: orange, at: [-5, 0, 0], faces: right, turn: 35, line: Working on it }
  # beside her, never between her and the camera; not tied to her, so it shows only when the voice names it
  gauge:      { kind: gauge, at: [-6.4, 0, 0.6], height: 1.5 }
  # her lists all hang in her lead room, one at a time
  settings:   { kind: list, at: [-2.8, 1.7, 0.4], style: cards, items: [model · Opus, effort · high, permissions · default] }
  lead.queue: { kind: list, at: [-2.8, 1.7, 0.4], items: [Read App.tsx, Read cart.ts, Read Header.tsx, Read routes.ts, Read orders.ts, Search "saved", Read auth.ts] }
  jobs:       { kind: list, at: [-2.8, 1.7, 0.4], style: cards, items: [Explore ./web · Haiku, Explore ./api · Haiku, Explore tests · Haiku] }
  brief:      { kind: list, at: [-2.8, 1.7, 0.4], style: cards, items: ["Goal: map ./api", "How: read routes, models", "Report: where it fits"] }
  plan:       { kind: list, at: [-2.8, 1.7, 0.4], items: [Map the API, Check the db, Write the change, Run the tests] }
  controls:   { kind: list, at: [-2.8, 1.7, 0.4], style: cards, items: ["/workflows · watch", pause, stop, save] }
  # helpers, in a line going right and back so none hides another or drops under the presenter
  web:    { kind: crew, tag: EXPLORE · HAIKU, accent: sky,        at: [-1.4, 0, 0.2],  faces: left, turn: 35, gauge: true, line: map ./web }
  api:    { kind: crew, tag: EXPLORE · HAIKU, accent: lilac,      at: [0.8, 0, -0.6],  faces: left, turn: 35, gauge: true, line: map ./api }
  tests:  { kind: crew, tag: EXPLORE · HAIKU, accent: periwinkle, at: [3.0, 0, -1.4],  faces: left, turn: 35, gauge: true, line: find the tests }
  routes: { kind: crew, tag: EXPLORE · HAIKU, accent: lilac,      at: [3.6, 0, -2.4],  faces: left, turn: 35, gauge: true, line: check routes }
  db:     { kind: crew, tag: EXPLORE · HAIKU, accent: lilac,      at: [4.0, 0, 0.4],   faces: left, turn: 35, gauge: true, line: check the db }
  # the workflow: its script, where the lesson pipeline runs, and the pads its agents stand on
  slate:  { kind: slate, at: [-2.6, 2.0, -0.6], title: "WORKFLOW · migrate-course.js", text: ["for (lesson of lessons)", "  fetch(lesson)", "  convert(lesson)", "  test(lesson)"] }
  slate2: { kind: slate, at: [-1.2, 3.4, -3.6], title: "WORKFLOW · trim-tests.js", text: ["for (file of testFiles)", "  review(file)", "  trim(file)"] }
  course: { kind: label, at: [-2.6, 0.75, -0.6], text: "COURSE · 48 LESSONS IN A CMS" }
  fetch:   { kind: crew, tag: FETCH,   accent: sky,        at: [-1.6, 0, 2.6], faces: right, turn: 40, line: "" }
  convert: { kind: crew, tag: CONVERT, accent: lilac,      at: [0.6, 0, 2.6],  faces: right, turn: 40, line: "" }
  test:    { kind: crew, tag: TEST,    accent: periwinkle, at: [2.8, 0, 2.6],  faces: right, turn: 40, line: "" }
  pads:   { kind: pad, grid: [4, 4], at: [2, 0, 0], spacing: 1.2 }
  agenda:
    kind: card
    title: IN THIS VIDEO
    rows:
      - [On its own, one session does every step]
      - [Subagents, helpers with their own context]
      - [Dynamic workflows, a script runs the agents]
  reach:
    kind: card
    title: REACH FOR A WORKFLOW
    rows:
      - [Same step, across lots of items]
      - [Migrations, a CMS course to markdown]
      - [Big refactors, one change in many files]
      - [Trimming tests, loads of AI-added tests]

shots:
  # ------------------------------------------------------------------ intro: one, then helpers, then a workflow
  - { id: i1, span: [0, hook.parallel-0.1], idea: "One Claude, getting work done.", look: lead,
      camera: { size: MS, on: { lead: [0.38, 0.68] }, angle: [25, -4], fov: 32, move: { kind: hold } },
      do: [{ at: 0, act: beam-in, who: lead }, { at: hook.work, act: say, who: lead, line: Working on it }] }
  - id: i2
    span: [hook.parallel-0.1, new.called-0.05]
    idea: Sub-agents explore the code and feed results back to the main agent.
    look: [web, api, tests]
    camera: { size: LS, on: { lead: [0.18, 0.56], tests: [0.66, 0.4] }, angle: [0, -26], fov: 40, move: { kind: hold } }
    do:
      - { at: subs.subagents-0.1, act: send, from: lead, to: [web, api, tests], lane: low, gap: 0.3, text: [map ./web, map ./api, find the tests] }
      - { after: 0.9, act: beam-in, who: [web, api, tests], gap: 0.3 }
      - { at: subs.results-0.2, act: status, who: [web, api, tests], to: done }
      - { at: subs.results, act: send, from: [web, api, tests], to: lead, lane: high, gap: 0.3, text: ["web: Header.tsx", "api: routes.ts", "tests: cart.test.ts"] }
      - { at: new.joined, act: beam-out, who: [web, api, tests], gap: 0.25 }
  - id: i3
    span: [new.called-0.05, plan.difference-0.15]
    idea: Something new has joined them, a dynamic workflow.
    look: pads
    camera: { size: LS, on: { slate: [0.28, 0.32], pads: [0.56, 0.46] }, angle: [-10, -30], fov: 40, move: { kind: hold } }
    do:
      - { at: new.dynamic-0.1, act: show, what: [slate, pads] }
      - { at: new.dynamic+0.2, act: beam-in, who: [pads.1-4, pads.5-8, pads.9-12, pads.13-16], gap: 0.3 }
  - id: i4
    span: [plan.difference-0.15, r1]
    idea: "The three ways, in order: on its own, subagents, workflows."
    look: agenda
    camera: { size: MLS, on: { lead: [0.3, 0.66] }, angle: [20, -6], fov: 35, move: { kind: hold } }
    do:
      - { at: plan.difference-0.15, act: hide, what: [slate, pads] }
      - { at: [plan.agent, plan.subagents, plan.dynamic], act: show, what: [agenda.1, agenda.2, agenda.3] }
    out: { kind: grid-wipe, over: 0.8, title: "1 · ON ITS OWN", resets: [lead, slate, pads, agenda] }

  # ------------------------------------------------------------------ 1 · on its own
  - id: a1
    span: [r1, r1.typing-0.3]
    idea: Start a session, as one agent.
    look: lead
    camera: { size: LS, on: { lead: [0.36, 0.6] }, angle: [12, -14], fov: 40, move: { kind: hold } }
    do:
      - { at: r1+0.3, act: title, text: "1 · ON ITS OWN" }
      - { at: r1.start, act: say, who: lead, line: Ready }
      - { at: r1.start, act: beam-in, who: lead }
  - id: a2
    span: [r1.typing-0.3, r2]
    idea: You type, and choose its model, effort and permissions.
    look: settings
    camera: { size: MS, on: { lead: [0.3, 0.6], settings: [0.64, 0.42] }, angle: [20, -6], fov: 35, move: { kind: hold } }
    do:
      - { at: r1.typing, act: say, who: lead, line: "› add a dark mode" }
      - { at: r1b.model-0.1, act: show, what: settings }
      - { at: r1b.model-0.1, act: tick, what: settings, every: 0.8 }
    out: { kind: grid-wipe, over: 0.8, title: "2 · SUBAGENTS", resets: [settings] }

  # ------------------------------------------------------------------ 2 · subagents
  - id: s1
    span: [r2, r2b]
    idea: Claude spins up sub-agents, and says so.
    look: [web, api, tests]
    camera: { size: LS, on: { lead: [0.18, 0.56], tests: [0.66, 0.4] }, angle: [0, -26], fov: 40, move: { kind: hold } }
    do:
      - { at: r2, act: status, who: [web, api, tests], to: working }
      - { at: r2.spin-0.1, act: send, from: lead, to: [web, api, tests], lane: low, gap: 0.3, text: [map ./web, map ./api, find the tests] }
      - { after: 1.0, act: beam-in, who: [web, api, tests], gap: 0.3 }
      - { at: r2.tell, act: say, who: lead, line: Running 3 Explore agents }
  - id: s2
    span: [r2b, r2c]
    idea: A sub-agent has a context window of its own.
    look: api.gauge
    camera: { size: MLS, on: { api: [0.34, 0.62], api.gauge: [0.52, 0.6] }, angle: [0, -8], fov: 35, move: { kind: hold } }
    do:
      - { at: r2b.context-0.1, act: glow, what: api.gauge, over: 1.2 }
  - id: s3
    span: [r2c, r2d]
    idea: So does the main session.
    look: gauge
    camera: { size: MS, on: { gauge: [0.3, 0.46], lead: [0.6, 0.6] }, angle: [12, -6], fov: 35, move: { kind: hold } }
    do:
      - { at: r2c, act: beam-out, who: [web, api, tests], gap: 0.2 }
      - { at: r2c.own-0.1, act: show, what: gauge, fill: 0.06 }
  - id: s4
    span: [r2d, r2e]
    idea: Alone, every read fills it, into the dumb zone.
    look: gauge
    camera: { size: LS, on: { gauge: [0.2, 0.5], lead.queue: [0.68, 0.38] }, angle: [15, -8], fov: 35, move: { kind: hold } }
    do:
      - { at: r2d+0.2, act: show, what: lead.queue }
      - { at: r2d+0.6, act: tick, what: lead.queue, every: 0.9 }
      - { at: r2d+0.8, act: fill, what: gauge, to: 0.55, over: 5.5 }
      - { at: r2d.dumb, act: glow, what: gauge, label: DUMB ZONE, over: 1.2 }
  - id: s5
    span: [r2e, r2f]
    idea: The fuller it gets, the worse it works.
    look: gauge
    camera: { size: MS, on: { gauge: [0.28, 0.5], lead: [0.6, 0.64] }, angle: [-12, -4], fov: 32, move: { kind: hold } }
    do:
      - { at: r2e.fills, act: fill, what: gauge, to: 0.9, over: 1.6 }
      - { at: r2e.worse, act: glow, what: gauge, over: 1.2 }
  - id: s6
    span: [r2f, r2g]
    idea: Sub-agents keep it emptier.
    look: gauge
    camera: { size: MLS, on: { gauge: [0.3, 0.48], lead: [0.56, 0.6] }, angle: [20, -6], fov: 35, move: { kind: hold } }
    do:
      - { at: r2f.protect, act: glow, what: gauge, over: 1 }
      - { at: r2f.emptier-0.1, act: show, what: gauge.ghost, to: 0.9, label: "ALONE · 90%" }
      - { at: r2f.emptier, act: fill, what: gauge, to: 0.08, over: 2 }
      - { at: r2f.emptier, act: hide, what: lead.queue }
  - id: s7
    span: [r2g, r2h]
    idea: You ask for a feature, and to explore the code first.
    look: lead
    camera: { size: MS, on: { lead: [0.4, 0.68] }, angle: [25, -4], fov: 32, move: { kind: hold } }
    do:
      - { at: r2g.implement, act: say, who: lead, line: "› add save-for-later" }
      - { at: r2g.existing, act: say, who: lead, line: "› explore the code first" }
  - id: s8
    span: [r2h, r2i.dispatches-0.3]
    idea: Several Explore agents, on a small, fast model.
    look: jobs
    camera: { size: MS, on: { lead: [0.3, 0.6], jobs: [0.64, 0.42] }, angle: [20, -6], fov: 35, move: { kind: hold } }
    do:
      - { at: r2h.explore-0.1, act: show, what: jobs }
      - { at: r2h.haiku, act: glow, what: jobs, over: 1 }
  - id: s9
    span: [r2i.dispatches-0.3, r2j.to]
    idea: Claude dispatches them, and they run off.
    look: [web, api, tests]
    camera: { size: LS, on: { lead: [0.18, 0.56], tests: [0.66, 0.4] }, angle: [0, -26], fov: 40, move: { kind: hold } }
    do:
      - { at: r2i.dispatches-0.1, act: hide, what: jobs }
